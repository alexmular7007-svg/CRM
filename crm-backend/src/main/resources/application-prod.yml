# ═══════════════════════════════════════════════════════════════════════════
# Production Profile Configuration
# ═══════════════════════════════════════════════════════════════════════════

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # Using update to create missing tables
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db.xkzpzcvwzqjavftrnxjl.supabase.co:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  # Redis auto-config: excluded only when REDIS_ENABLED=false (e.g. bare Render deploy).
  # On AWS ECS/Docker where Redis IS available, set REDIS_ENABLED=true to skip exclusion.
  autoconfigure:
    exclude: ${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration}

logging:
  level:
    root: WARN
    com.arjun.crm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

server:
  port: ${SERVER_PORT:8080}
  address: 0.0.0.0
  error:
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true

# Restricted actuator endpoints in production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: ${REDIS_ENABLED:false}

# API Documentation disabled in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Strict CORS for production — must be set via env var
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://crm-taskflow.vercel.app,https://crm-taskflow-production.up.railway.app}
  allow-credentials: true

# WebSocket configuration for production
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:https://crm-taskflow.vercel.app,https://*.vercel.app,https://crm-taskflow-production.up.railway.app}

# Redis presence service: set REDIS_ENABLED=true when Redis is available
redis:
  enabled: ${REDIS_ENABLED:false}
# Resend Email Configuration
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

# OAuth2 Client Configuration - for production
spring.security.oauth2.client.registration.google.client-id: ${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret: ${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope: openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri: "${OAUTH2_REDIRECT_URI_GOOGLE:https://crm-taskflow-production.up.railway.app/login/oauth2/code/google}"

spring.security.oauth2.client.registration.github.client-id: ${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret: ${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope: read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri: "${OAUTH2_REDIRECT_URI_GITHUB:https://crm-taskflow-production.up.railway.app/login/oauth2/code/github}"

spring.security.oauth2.client.provider.google.authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri: https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri: https://www.googleapis.com/oauth2/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute: sub

spring.security.oauth2.client.provider.github.authorization-uri: https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri: https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri: https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute: id

# OAuth2 redirect after login
oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}

# Application configuration
app:
  mail:
    from: ${APP_MAIL_FROM:xsde790@gmail.com}
    from-name: ${APP_MAIL_FROM_NAME:TaskFlow}
  invitation-base-url: ${INVITATION_BASE_URL:https://crm-taskflow.vercel.app/invitations}
  oauth2-frontend-failure-url: ${OAUTH2_FRONTEND_FAILURE_URL:https://crm-taskflow.vercel.app/login?error=oauth2_failed}

# Supabase Storage Configuration (File Upload/Download)
supabase:
  url: ${SUPABASE_URL:https://db.xkzpzcvwzqjavftrnxjl.supabase.co}
  anon-key: ${SUPABASE_ANON_KEY}
  service-key: ${SUPABASE_SERVICE_KEY}
  storage:
    bucket-name: ${SUPABASE_STORAGE_BUCKET:chat-attachments}
    chat-folder: ${SUPABASE_CHAT_FOLDER:chat}
    task-folder: ${SUPABASE_TASK_FOLDER:tasks}
    max-file-size: ${SUPABASE_MAX_FILE_SIZE:20971520}
    signed-url-expiry: ${SUPABASE_SIGNED_URL_EXPIRY:604800}
    is-public: ${SUPABASE_BUCKET_PUBLIC:false}

# AI Configuration (xAI)
ai:
  xai:
    api-key: ${XAI_API_KEY}
    model: ${XAI_MODEL:grok-4.20-reasoning}
    base-url: ${XAI_BASE_URL:https://api.x.ai/v1/chat/completions}
    temperature: ${AI_TEMPERATURE:0.7}
    max-tokens: ${AI_MAX_TOKENS:1000}
    timeout: ${AI_TIMEOUT:30000}
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      backoff-delay: ${AI_RETRY_BACKOFF:1000}
  cache:
    ttl: ${AI_CACHE_TTL:1800000}

# Brevo Email Configuration
brevo:
  api-key: ${BREVO_API_KEY}
  api-url: https://api.brevo.com/v3/smtp/email